services:
  api:
    image: node:22-alpine
    working_dir: /srv
    volumes:
      - ./backend:/srv:ro
    command: node server.mjs
    environment:
      MAILPIT_URL: http://mailpit:8025
      SALES_EMAIL: ${SALES_EMAIL:-sales@example.test}
    ports:
      - "127.0.0.1:3000:3000"
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
